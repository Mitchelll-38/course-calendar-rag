[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-calendar-rag"
version = "0.1.0"
description = "Hybrid retrieval Q&A for academic calendar content"
requires-python = ">=3.11"

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0,<4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
calendar-rag = "course_calendar_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
